name: CI

# push 到任意分支 + 所有 PR 都跑。
on:
  push:
    branches: ["**"]
  pull_request:

# 最小权限：只读仓库内容，不用任何 secret。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-selftest:
    name: lint + selftest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 只放 AstrBot 支持的版本：astrbot_src/pyproject.toml 第 7 行 requires-python = ">=3.12"
        python-version: ["3.12", "3.13"]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查（compileall）
        run: python -m compileall -q .

      - name: 安装 ruff
        run: pip install ruff==0.17.3

      - name: ruff check（规则见 ruff.toml）
        run: ruff check --output-format concise .

      - name: 自测（离线，无凭证）
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tests/selftest.py --offline

  manifest:
    name: manifest 体检
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 pyyaml
        run: pip install pyyaml==6.0.2

      - name: 校验 metadata.yaml / _conf_schema.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/check_manifest.py
